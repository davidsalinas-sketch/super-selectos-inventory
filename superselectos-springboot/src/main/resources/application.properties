# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

# ========================================
# THYMELEAF CONFIGURATION
# ========================================
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================================
# SECURITY CONFIGURATION
# ========================================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Session timeout (30 minutos)
server.servlet.session.timeout=30m
spring.session.store-type=none

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.com.superselectos.inventory=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Archivo de logs
logging.file.name=logs/superselectos-inventory.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Información de la aplicación
info.app.name=Super Selectos Inventory System
info.app.version=2.5.1
info.app.description=Sistema profesional de inventario para Super Selectos El Salvador
info.app.author=David
info.app.build-date=2025-10-28

# ========================================
# FILE UPLOAD CONFIGURATION
# ========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# INTERNATIONALIZATION
# ========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ========================================
# PDF GENERATION CONFIGURATION
# ========================================
app.pdf.author=Sistema Super Selectos
app.pdf.title=Reporte de Inventario
app.pdf.subject=Inventario por Sucursales
app.pdf.creator=Super Selectos Inventory System v2.5.1

# ========================================
# BUSINESS CONFIGURATION
# ========================================
app.business.name=Super Selectos
app.business.country=El Salvador
app.business.branches.count=118
app.business.logo.url=https://www.superselectos.com/img/super-selectos-banner.jpg

# Categorías de productos disponibles
app.categories=Alimentos,Bebidas,Carnes,Frutas,Limpieza,Juguetes,Otros

# ========================================
# CACHE CONFIGURATION
# ========================================
spring.cache.type=simple
spring.cache.cache-names=products,users,distributors,branches

# ========================================
# DEVELOPMENT CONFIGURATION
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true