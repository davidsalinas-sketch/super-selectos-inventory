# ========================================
# SUPER SELECTOS - CONFIGURACIÓN DATABASE
# ========================================
spring.application.name=SuperSelectos Inventory System
server.port=8080

# ========================================
# DATABASE CONFIGURATION
# ========================================
# H2 Database para desarrollo (cambiar a MySQL en producción)
spring.datasource.url=jdbc:h2:mem:superselectos
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Habilitar H2 Console para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Inicializar datos de prueba
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ========================================
# MYSQL CONFIGURATION (Para Producción)
# ========================================
# Descomentar y configurar para MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/superselectos_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=superselectos_user
# spring.datasource.password=SuperS3l3ct0s2025!
